name: Quality gates

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install SASL build headers
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libsasl2-dev

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Check Python dependencies
        run: python -m pip check

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.23.1"
          cache: npm
          cache-dependency-path: |
            evaluation/promptfoo/package-lock.json
            frontend/package-lock.json

      - name: Install Promptfoo evaluation dependencies
        working-directory: evaluation/promptfoo
        run: npm ci

      - name: Run offline Promptfoo Stub evaluation
        working-directory: evaluation/promptfoo
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PROMPTFOO_PYTHON: python
        run: npm run eval:stub

      - name: Verify Promptfoo failures return non-zero
        working-directory: evaluation/promptfoo
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PROMPTFOO_PYTHON: python
        run: npm run verify:failure-exit

      - name: Run offline Promptfoo AI security evaluation
        working-directory: evaluation/promptfoo
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PROMPTFOO_PYTHON: python
        run: npm run eval:security

      - name: Run offline Pydantic AI skill-routing evaluation
        working-directory: evaluation/promptfoo
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PROMPTFOO_PYTHON: python
        run: npm run eval:agent

      - name: Run default backend tests
        env:
          JWT_SECRET: ci-temporary-test-secret
          PYTHONDONTWRITEBYTECODE: "1"
          ROUND_15_REPORTS_REQUIRED: "1"
        run: python -m pytest backend/tests -q -p no:cacheprovider

      - name: Run frozen RAG retrieval evaluation
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python evaluation/rag_retrieval_runner.py --output /tmp/cultural-rag-retrieval.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run frontend E2E tests
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload Round 15 evaluation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: round-15-llm-evaluation
          if-no-files-found: error
          path: |
            evaluation/artifacts/round-15-results.json
            evaluation/artifacts/round-15-report.html
            evaluation/artifacts/round-15-junit.xml

      - name: Upload Round 16 security evaluation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: round-16-promptfoo-redteam
          if-no-files-found: error
          path: |
            evaluation/artifacts/latest.json
            evaluation/artifacts/latest.html
            evaluation/artifacts/latest.junit.xml

      - name: Upload Round 17A agent evaluation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: round-17a-pydantic-agent
          if-no-files-found: error
          path: |
            evaluation/artifacts/round-17a-results.json
            evaluation/artifacts/round-17a-report.html
            evaluation/artifacts/round-17a.junit.xml

      - name: Check committed diff whitespace
        run: git diff --check HEAD^ HEAD

      - name: Reject tracked secrets and private keys
        shell: bash
        run: |
          if git ls-files --error-unmatch backend/.env >/dev/null 2>&1; then
            echo "backend/.env must not be tracked"
            exit 1
          fi
          if git grep -nE -- '-----BEGIN (RSA |EC |OPENSSH |)?PRIVATE KEY-----'; then
            exit 1
          fi
          if git grep -nE -- '^(DASHSCOPE_API_KEY|MYSQL_PASSWORD|JWT_SECRET)=[^[:space:]]+' -- ':!backend/.env.example'; then
            exit 1
          fi
          if git grep -nE -- 'mysql(\+[^:]+)?://[A-Za-z0-9._-]+:[A-Za-z0-9._-]+@'; then
            exit 1
          fi
